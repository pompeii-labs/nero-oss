# Nero web container. Serves the static SPA and proxies the API to the `api`
# service on the compose network. Single origin → no CORS, no API-URL config.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API, file serving, and inbound webhooks go to the Bun service.
    location ~ ^/(v1|api|webhook)(/|$) {
        proxy_pass http://api:4848;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # allow streaming / upgrades if the API ever uses them
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    # SPA fallback: deep links and refreshes resolve to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
