# Nero web container. Serves the static SPA and proxies both the API and the Lux
# engine, so the browser talks to ONE origin. No CORS, no API/engine URL config,
# and it works from localhost, a LAN IP, or a domain (the browser never needs to
# reach a second port).
#
# The :80 server is always here. HTTPS is opt-in: `nero start` generates a cert
# and mounts a :443 server into tls.d (see cli/src/home.ts). Voice/mic needs a
# secure context, so HTTPS is what makes voice work off localhost.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Optional TLS server, mounted by the CLI when a cert is provisioned (empty = no-op).
include /etc/nginx/tls.d/*.conf;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/nero-locations.conf;
}
