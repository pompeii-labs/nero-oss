# Shared location blocks, included by both the :80 server and the CLI-mounted
# :443 TLS server so the proxy config lives in exactly one place.

# .webmanifest gets the right MIME (nginx doesn't know it by default).
location = /manifest.webmanifest {
    default_type application/manifest+json;
    try_files $uri =404;
}

# ES-module + wasm assets (the onnxruntime-web wakeword loader) need a JS/wasm MIME,
# or the browser refuses to import()/instantiate them (nginx defaults to octet-stream).
location ~ \.mjs$ {
    default_type text/javascript;
}
location ~ \.wasm$ {
    default_type application/wasm;
}

# Serve the PUBLIC TLS cert so a device installs + trusts it by visiting this URL
# (over http, since you can't reach https cleanly until it's trusted). Safe: this is
# the cert, never the private key. iOS sees the MIME and offers to install a profile.
location = /cert.crt {
    alias /etc/nginx/certs/ca.pem;
    default_type application/x-x509-ca-cert;
    add_header Content-Disposition 'attachment; filename="nero-ca.crt"';
}

# API, file serving, and inbound webhooks go to the Bun service.
location ~ ^/(v1|api|webhook)(/|$) {
    proxy_pass http://api:4848;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_buffering off;
    proxy_read_timeout 3600s;
}

# Lux engine (HTTP SDK + realtime WebSocket). The SPA uses same-origin `/lux`,
# so /lux/exec, /lux/auth/v1/*, and the /lux/live socket all land here. The
# trailing slash strips the /lux prefix before forwarding to the engine.
location /lux/ {
    proxy_pass http://lux:8080/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_buffering off;
    proxy_read_timeout 3600s;
}

# Content-addressed build assets (hashed filenames) never change → cache forever.
location /_app/immutable/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
}

# SPA fallback: deep links and refreshes resolve to index.html. The entry must
# always revalidate so a fresh deploy shows on a normal reload (it points at the
# new hashed bundles). no-cache = revalidate, not "don't store".
location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
}
