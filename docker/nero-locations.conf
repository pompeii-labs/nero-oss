# Shared location blocks, included by both the :80 server and the CLI-mounted
# :443 TLS server so the proxy config lives in exactly one place.

# .webmanifest gets the right MIME (nginx doesn't know it by default).
location = /manifest.webmanifest {
    default_type application/manifest+json;
    try_files $uri =404;
}

# API, file serving, and inbound webhooks go to the Bun service.
location ~ ^/(v1|api|webhook)(/|$) {
    proxy_pass http://api:4848;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_buffering off;
    proxy_read_timeout 3600s;
}

# Lux engine (HTTP SDK + realtime WebSocket). The SPA uses same-origin `/lux`,
# so /lux/exec, /lux/auth/v1/*, and the /lux/live socket all land here. The
# trailing slash strips the /lux prefix before forwarding to the engine.
location /lux/ {
    proxy_pass http://lux:8080/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_buffering off;
    proxy_read_timeout 3600s;
}

# SPA fallback: deep links and refreshes resolve to index.html.
location / {
    try_files $uri $uri/ /index.html;
}
