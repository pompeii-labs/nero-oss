name: Release

on:
  push:
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}

jobs:
  build-binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches package.json
        run: |
          TAG_VERSION=${GITHUB_REF#refs/tags/v}
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Error: tag v$TAG_VERSION != package.json $PKG_VERSION"; exit 1
          fi

      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile

      - name: Build nero + host-runner binaries
        run: |
          mkdir -p dist/binaries
          for target in bun-linux-x64 bun-linux-arm64 bun-darwin-x64 bun-darwin-arm64; do
            s=${target#bun-}
            bun build --compile --target=$target cli/src/index.ts --outfile dist/binaries/nero-$s
            bun build --compile --target=$target cli/src/hostrunner/server.ts --outfile dist/binaries/nero-runner-$s
          done
          cd dist/binaries && sha256sum nero-* > checksums.txt

      - uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: dist/binaries/

  build-images:
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image:
          - { name: api, file: Dockerfile.api, context: . }
          - { name: web, file: Dockerfile.web, context: . }
          - { name: media, file: media/Dockerfile, context: media }
        platform:
          - { arch: amd64, runner: ubuntu-latest }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.platform.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.file }}
          platforms: linux/${{ matrix.platform.arch }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.OWNER }}/nero-${{ matrix.image.name }}:build-${{ matrix.platform.arch }}
          cache-from: type=gha,scope=${{ matrix.image.name }}-${{ matrix.platform.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}-${{ matrix.platform.arch }}

      - run: echo "${{ steps.build.outputs.digest }}" > digest-${{ matrix.platform.arch }}.txt
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.image.name }}-${{ matrix.platform.arch }}
          path: digest-${{ matrix.platform.arch }}.txt

  merge-images:
    needs: build-images
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        name: [api, web, media]
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER }}/nero-${{ matrix.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - uses: actions/download-artifact@v4
        with:
          pattern: digest-${{ matrix.name }}-*
          path: digests
          merge-multiple: true

      - name: Create + push manifest
        run: |
          IMG=${{ env.REGISTRY }}/${{ env.OWNER }}/nero-${{ matrix.name }}
          AMD=$(cat digests/digest-amd64.txt)
          ARM=$(cat digests/digest-arm64.txt)
          TAGS=$(echo "${{ steps.meta.outputs.tags }}" | tr '\n' ' ')
          for T in $TAGS; do
            docker buildx imagetools create -t "$T" "$IMG@$AMD" "$IMG@$ARM"
          done

  create-release:
    needs: [build-binaries, merge-images]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: binaries
          path: binaries/
      - uses: softprops/action-gh-release@v1
        with:
          files: |
            binaries/nero-*
            binaries/checksums.txt
          generate_release_notes: true
